name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete: {}

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://mihnea.remetan:${GITLAB_TOKEN}@gitlab.upt.ro/mihnea.remetan/bike-ledger.git"
          git push --prune gitlab \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            ':refs/heads/HEAD'